# Dependabot — keeps Go modules, GitHub Actions and the semantic-release tooling current.
# The module has no external Go dependencies today; gomod is watched for when it does.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vilnius
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vilnius
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci'
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Vilnius
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
    groups:
      release-tooling:
        patterns:
          - '*'
    ignore:
      # conventional-changelog-conventionalcommits 10 needs
      # conventional-changelog-writer@9; @semantic-release/release-notes-generator
      # 14.x ships writer 8, so v10 breaks release notes ("Missing helper").
      - dependency-name: 'conventional-changelog-conventionalcommits'
        versions: ['>= 10']
